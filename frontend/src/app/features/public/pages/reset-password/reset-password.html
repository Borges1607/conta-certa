@if (!token) {
  <cc-auth-card heading="Link incompleto">
    <div class="reset__notice">
      <i class="pi pi-link" aria-hidden="true"></i>
      <p>Este endereço não tem o código de recuperação. Solicite um novo link.</p>
      <p-button label="Solicitar novo link" icon="pi pi-refresh" routerLink="/esqueci-senha" />
    </div>
  </cc-auth-card>
} @else if (tokenGone()) {
  <cc-auth-card heading="Link expirado ou já utilizado">
    <div class="reset__notice">
      <i class="pi pi-clock" aria-hidden="true"></i>
      <p>Por segurança, cada link de recuperação vale uma única vez.</p>
      <p-button label="Solicitar novo link" icon="pi pi-refresh" routerLink="/esqueci-senha" />
    </div>
  </cc-auth-card>
} @else {
  <cc-auth-card heading="Definir nova senha">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (formError()) {
        <p-message severity="error" styleClass="reset__alert">{{ formError() }}</p-message>
      }

      <cc-form-field
        label="Nova senha"
        inputId="newPassword"
        [control]="form.controls.newPassword"
        [required]="true"
      >
        <p-password
          inputId="newPassword"
          formControlName="newPassword"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          [fluid]="true"
        />
      </cc-form-field>

      <cc-password-requirements [password]="form.controls.newPassword.value" />

      <cc-form-field
        label="Confirmar nova senha"
        inputId="passwordConfirm"
        [control]="form.controls.passwordConfirm"
        [required]="true"
      >
        <p-password
          inputId="passwordConfirm"
          formControlName="passwordConfirm"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          [fluid]="true"
        />
      </cc-form-field>

      <cc-submit-button
        label="Salvar nova senha"
        icon="pi pi-check"
        [submitting]="guard.submitting()"
        [fluid]="true"
      />
    </form>

    <p class="reset__links"><a routerLink="/login">Voltar ao login</a></p>
  </cc-auth-card>
}
