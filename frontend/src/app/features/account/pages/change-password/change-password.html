<div class="cc-page cc-page--narrow">
  <cc-page-header title="Trocar senha" />

  @if (auth.mustChangePassword()) {
    <p-message severity="warn" styleClass="pwd__alert">
      Você precisa definir uma nova senha antes de continuar usando o Conta Certa.
    </p-message>
  }

  <section class="pwd__card cc-card">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (formError()) {
        <p-message severity="error" styleClass="pwd__alert">{{ formError() }}</p-message>
      }

      <cc-form-field
        label="Senha atual"
        inputId="currentPassword"
        [control]="form.controls.currentPassword"
        [required]="true"
      >
        <p-password
          inputId="currentPassword"
          formControlName="currentPassword"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          [fluid]="true"
        />
      </cc-form-field>

      <cc-form-field
        label="Nova senha"
        inputId="newPassword"
        [control]="form.controls.newPassword"
        [required]="true"
      >
        <p-password
          inputId="newPassword"
          formControlName="newPassword"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          [fluid]="true"
        />
      </cc-form-field>

      <cc-password-requirements [password]="form.controls.newPassword.value" />

      <cc-form-field
        label="Confirmar nova senha"
        inputId="passwordConfirm"
        [control]="form.controls.passwordConfirm"
        [required]="true"
      >
        <p-password
          inputId="passwordConfirm"
          formControlName="passwordConfirm"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          [fluid]="true"
        />
      </cc-form-field>

      <cc-submit-button label="Salvar nova senha" icon="pi pi-check" [submitting]="guard.submitting()" />
    </form>
  </section>
</div>
