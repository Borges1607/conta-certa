spring.application.name=contacerta

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contacerta}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
#spring.jpa.show-sql=true

#spring.flyway.plugins.postgresql.ignore-future-versions=true

# server config
server.port=8080
server.servlet.context-path=/api/v1

app.security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
app.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}
app.security.jwt.access-token-ttl=PT15M
app.security.session.refresh-token-ttl=P7D
app.security.password.bcrypt-strength=12

app.initial-admin.name=${INITIAL_ADMIN_NAME:}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

app.attempt.idempotency-ttl=PT24H
app.attempt.expiration-batch-size=100
app.attempt.expiration-fixed-delay=60000

app.account.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.account.token.email-verification-ttl=PT24H
app.account.token.teacher-invitation-ttl=PT72H
app.account.token.password-reset-ttl=PT30M
app.account.rate-limit.allowance=5
app.account.rate-limit.window=PT1H

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:Conta Certa <no-reply@contacerta.local>}
app.mail.batch-size=20
app.mail.max-attempts=5
app.mail.claim-lease=PT10M
app.mail.retry-delays=PT1M,PT5M,PT15M,PT1H
app.mail.poll-delay-ms=5000
